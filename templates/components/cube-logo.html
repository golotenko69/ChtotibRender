{% comment %}
Isometric print-layer cube — the site's visual signature.
Usage: {% include "components/cube-logo.html" with size=32 %}
Faces: top=teal (fresh layer), left=dark (shadow face), right=orange (accent/just-printed face).
{% endcomment %}
<svg width="{{ size|default:32 }}" height="{{ size|default:32 }}" viewBox="0 0 40 42" fill="none" class="cube-mark" aria-hidden="true">
    <polygon points="20,1 39,11 20,21 1,11" fill="#4A7A88" />
    <polygon points="1,11 20,21 20,41 1,31" fill="#1F3A42" />
    <polygon points="39,11 39,31 20,41 20,21" fill="#FF7A1A" />
    <polyline points="20,1 20,21" stroke="rgba(0,0,0,0.15)" stroke-width="0.6" />
    <polyline points="20,21 1,11" stroke="rgba(0,0,0,0.12)" stroke-width="0.6" />
    <polyline points="20,21 39,11" stroke="rgba(0,0,0,0.12)" stroke-width="0.6" />
    <polyline points="20,21 20,41" stroke="rgba(0,0,0,0.15)" stroke-width="0.6" />
</svg>
