name: Deploy

# Runs after CI succeeds on main: builds the Docker image, pushes it to
# GitHub Container Registry (ghcr.io), then deploys it to the VPS over SSH.
#
# Registry auth uses the built-in GITHUB_TOKEN - no registry secrets needed.
#
# GitHub Secrets for the VPS step (Settings -> Secrets and variables -> Actions).
# Until SSH_HOST is set, the VPS deploy is skipped and only the image is pushed:
#   SSH_HOST             - VPS hostname or IP
#   SSH_USER             - SSH user on the VPS
#   SSH_PRIVATE_KEY      - private key with access to the VPS
#   SSH_PORT             - (optional) SSH port, defaults to 22
#   DEPLOY_PATH          - absolute path to the project on the VPS
#
# No secrets are ever hard-coded in this file or committed to the repo.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Deploy only when CI passed for a push to main (or when started manually).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      image_tag: ${{ steps.meta.outputs.tag }}
    env:
      # Deploy exactly the commit CI tested, not whatever main points to now.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Compute image name and tag
        id: meta
        run: |
          # ghcr.io requires a lowercase image name.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${DEPLOY_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            REQUIREMENTS_FILE=requirements/prod.txt
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Skip - VPS not configured
        if: env.SSH_HOST == ''
        run: echo "::notice::SSH_HOST secret is not set - image pushed, VPS deploy skipped."

      - name: Deploy over SSH
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "IMAGE_NAME=${{ needs.build-and-push.outputs.image }}" > .env.deploy
            echo "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}" >> .env.deploy
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.deploy pull web
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.deploy up -d
            docker logout ghcr.io
            docker image prune -f
