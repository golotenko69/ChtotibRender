name: Deploy

# Runs after CI succeeds on main, builds and pushes a Docker image, then
# deploys it to the VPS over SSH using docker compose.
#
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   REGISTRY_USERNAME   - Docker registry username (e.g. Docker Hub / GHCR)
#   REGISTRY_PASSWORD   - Docker registry password or access token
#   REGISTRY_IMAGE       - full image name, e.g. ghcr.io/org/3dprint-web
#   SSH_HOST             - VPS hostname or IP
#   SSH_USER             - SSH user on the VPS
#   SSH_PRIVATE_KEY      - private key with access to the VPS
#   SSH_PORT              - (optional) SSH port, defaults to 22
#   DEPLOY_PATH          - absolute path to the project on the VPS
#
# No secrets are ever hard-coded in this file or committed to the repo.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build-and-push:
    # Deploy only when CI passed for a push to main (or when started manually).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    env:
      # Deploy exactly the commit CI tested, not whatever main points to now.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Compute image tag
        id: meta
        run: echo "tag=${DEPLOY_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            REQUIREMENTS_FILE=requirements/prod.txt
          tags: |
            ${{ secrets.REGISTRY_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ secrets.REGISTRY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "IMAGE_NAME=${{ secrets.REGISTRY_IMAGE }}" > .env.deploy
            echo "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}" >> .env.deploy
            docker login -u "${{ secrets.REGISTRY_USERNAME }}" -p "${{ secrets.REGISTRY_PASSWORD }}"
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.deploy pull web
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.deploy up -d
            docker image prune -f
