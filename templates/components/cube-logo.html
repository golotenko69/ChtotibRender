{% comment %}
Layer-stack mark — the site's visual signature: four printed layers,
the hot amber base and mint layers cooling towards the top.
Usage: {% include "components/cube-logo.html" with size=32 %}
{% endcomment %}
<svg width="{{ size|default:32 }}" height="{{ size|default:32 }}" viewBox="0 0 26 26" fill="none" class="cube-mark" aria-hidden="true">
    <rect x="3" y="18" width="20" height="3" rx="1.5" fill="#FF8A3D" />
    <rect x="5" y="13" width="16" height="3" rx="1.5" fill="#7DBFB4" opacity=".9" />
    <rect x="7" y="8" width="12" height="3" rx="1.5" fill="#7DBFB4" opacity=".6" />
    <rect x="9" y="3" width="8" height="3" rx="1.5" fill="#7DBFB4" opacity=".35" />
</svg>
