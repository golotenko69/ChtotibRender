upstream django_app {
    server web:8000;
}

# Throttle POSTs per client IP (GETs map to an empty key and are not
# limited): login forms get a tight budget against password guessing,
# request/cart forms a looser one against spam floods.
map $request_method $post_client {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $post_client zone=login_posts:10m rate=5r/m;
limit_req_zone $post_client zone=form_posts:10m rate=30r/m;
limit_req_status 429;

server_tokens off;

server {
    listen 80;
    server_name _;

    client_max_body_size 120M;
    client_body_timeout 60s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    location /static/ {
        alias /app/staticfiles/;
        # collectstatic already writes .gz copies next to each file
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Client uploads: never let the browser sniff or execute them, and
    # hand 3D models out as downloads rather than rendering them inline.
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }

    location ~* ^/media/(.+\.(?:stl|obj|3mf|step|stp))$ {
        alias /app/media/$1;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Content-Disposition "attachment" always;
    }

    location ~ ^/(manage|admin)/login/ {
        limit_req zone=login_posts burst=5 nodelay;
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=form_posts burst=20 nodelay;
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

